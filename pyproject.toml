[project]
name = "sqlibrarian"
version = "0.1.0"
description = "Bilingual (Arabic/English) text-to-SQL assistant for student records, using a fine-tuned small model and PostgreSQL row-level security"
readme = "README.md"
authors = [
    { name = "OmarAmir2001", email = "omaramir2001@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.30.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sqlibrarian = "sqlibrarian:main"

[project.optional-dependencies]
training = [
    "datasets>=5.1.0",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.44.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = style errors, F = real bugs (unused imports, undefined names),
# I = import order, B = common bug patterns, UP = modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
