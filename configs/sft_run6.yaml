# SFT run 6: schema v2 (standing, warnings, excuses, offerings, rules) and schema augmentation.
# own = 1,940 pairs (1,475 + 465 Egyptian/mixed rewrites), each also under 2 renamed schemas
# (training/schema_variants.py) = ~5,800 examples, shown once; plus 3,000 Spider/Ar-Spider.
# Same size as run 5 (~8,800 examples, ~550 steps, 3-3.5 h on one T4). Score it twice:
# dev (59 questions) and --variant heldout (a renamed schema never seen in training).
run_name: sft-run6
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 3000
own_repeat: 1
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
