# SFT run 7: run 6's setup on cleaner data. Arabic/Egyptian/mixed pairs now show Arabic
# names (title_ar), and pairs that find "last term" from the newest term, or that are
# empty for every student, are dropped (validate_pairs). own = 1,753 pairs (1,337 + 416
# rewrites), each also under 2 renamed schemas = ~5,250 examples, shown once; plus 3,000
# Spider/Ar-Spider (~8,000 examples, ~3 h on one T4). Score it twice: dev and --variant heldout.
run_name: sft-run7
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 3000
own_repeat: 1
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
