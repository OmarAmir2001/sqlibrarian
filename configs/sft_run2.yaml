# SFT run 2: same as run 1, but more weight on our own pairs (now all 12 question types,
# sharper Groq rules) and less Spider, whose habits (t1/t2 aliases, invented tables)
# leaked into run 1. About the same size, so 2-3 hours on one T4.
run_name: sft-run2
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 4000
own_repeat: 3
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
