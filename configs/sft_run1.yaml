# First SFT run: Qwen2.5-Coder-1.5B (settings.base_model) + LoRA, plain TRL + PEFT.
# Data: up to 6,000 Spider/Ar-Spider examples + own pairs x2. About 2-3 hours on one T4.
run_name: sft-run1
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 6000
own_repeat: 2
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
