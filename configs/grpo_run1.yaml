# First GRPO run: a short trial on top of SFT run 9 (best SFT: 62.7% ours, 55.9% held-out).
# Half the prompts show a renamed schema; the reward runs those completions on views with
# the variant's names (training/rewards.py), so GRPO stays database-agnostic.
# 600 prompts x 4 completions, 8 completions per step (2 prompts) = 300 steps, ~2-3 h on a T4.
# If the reward mean rises and the score holds, a longer run follows (prompts_max 1500+).
run_name: grpo-run1
start_model: OmarAmir2001/sqlibrarian-sft-run9
prompts_max: 600
renamed_share: 0.5
num_generations: 4
max_completion_length: 256
temperature: 0.9
beta: 0.0
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
reward_students: 3
seed: 42
push_to_hub: true
