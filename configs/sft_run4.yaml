# SFT run 4: 1,442 own pairs (all 12 question types; the later ones written with the
# sharper Groq rules) x3, plus 3,000 Spider/Ar-Spider. Run 3 (708 own pairs, 4,000 public)
# scored 26% on the dev set. About 7,300 examples, ~460 steps, 2.5-3 hours on one T4.
run_name: sft-run4
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 3000
own_repeat: 3
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
