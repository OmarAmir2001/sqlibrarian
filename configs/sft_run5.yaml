# SFT run 5: own v4 = 1,442 pairs + 475 Egyptian/mixed rewrites (1,917) x3, plus 3,000
# Spider/Ar-Spider. Same settings as run 4 (52% on the dev set), so the only change is the
# rewrites. About 8,750 examples, ~545 steps, 3-3.5 hours on one T4.
run_name: sft-run5
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 3000
own_repeat: 3
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
