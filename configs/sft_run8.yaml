# SFT run 8: run 7's settings on more data. own = 2,009 pairs (Groq day 5 adds the new
# tables and many wordings of "my GPA") + 966 Egyptian/mixed rewrites, each also under 2
# renamed schemas = 8,925 examples (data f8852bb87eff), shown once; plus 3,000 Spider/Ar-Spider
# (~11,500 examples, ~720 steps, ~4-4.5 h on one T4). Score it twice: dev and --variant heldout.
run_name: sft-run8
use_unsloth: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
public_max: 3000
own_repeat: 1
eval_fraction: 0.05
learning_rate: 1.0e-4
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
eval_steps: 100
seed: 42
push_to_hub: true
